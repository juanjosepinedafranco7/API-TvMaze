<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Explorer - TVMaze</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Movie Explorer</h1>
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Busca una serie o película...">
            <button id="search-button">Buscar</button>
        </div>
    </header>

    <main id="results-container">
        <p class="welcome-msg">Ingresa el nombre de tu serie favorita para comenzar.</p>
    </main>

    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
